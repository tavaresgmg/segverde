<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple icon style - mais arredondado -->
  <defs>
    <radialGradient id="appleBgGradient" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <linearGradient id="appleLeafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#065f46" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados (estilo Apple) -->
  <rect x="10" y="10" width="160" height="160" rx="35" ry="35" 
        fill="url(#appleBgGradient)" stroke="#047857" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Folha principal mais detalhada -->
  <path d="M40 110 Q45 40 90 50 Q135 40 140 110 Q135 140 90 130 Q45 140 40 110 Z" 
        fill="url(#appleLeafGradient)" stroke="#065f46" stroke-width="3"/>
  
  <!-- Nervura central -->
  <path d="M90 50 Q90 70 90 130" stroke="#047857" stroke-width="4" fill="none"/>
  
  <!-- Nervuras secundárias */
  <path d="M65 75 Q77 70 90 75 Q103 70 115 75" stroke="#047857" stroke-width="2.5" fill="none"/>
  <path d="M60 95 Q75 90 90 95 Q105 90 120 95" stroke="#047857" stroke-width="2.5" fill="none"/>
  <path d="M65 115 Q77 110 90 115 Q103 110 115 115" stroke="#047857" stroke-width="2" fill="none"/>
  
  <!-- Sistema de rastreamento - pontos maiores para melhor visibilidade -->
  <circle cx="70" cy="70" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <circle cx="90" cy="60" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <circle cx="110" cy="70" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <circle cx="75" cy="100" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <circle cx="105" cy="100" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <circle cx="90" cy="120" r="6" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  
  <!-- Rede de conexões mais elaborada -->
  <path d="M70 70 L90 60 L110 70 M75 100 L105 100 M90 60 L90 80" 
        stroke="#d1fae5" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M70 70 L75 100 M110 70 L105 100 M90 80 L90 120" 
        stroke="#d1fae5" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M75 100 L90 120 L105 100" 
        stroke="#d1fae5" stroke-width="2" fill="none" opacity="0.6"/>
</svg>